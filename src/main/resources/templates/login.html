<!DOCTYPE html>
    <html lang="en">
    <head th:replace="~{fragments/header :: header('登入')}"></head>
    <body class="bg-gray-100 min-h-screen flex items-center justify-center">
        <form th:action="@{/login}" method="post" class="space-y-5">
            <div id="app" class="w-full max-w-md bg-white rounded-xl shadow-lg p-8">
                <div class="flex flex-col gap-3">
                    <div class="text-center">
                        <h1 class="text-3xl font-bold text-gray-800">登入</h1>
                        <p class="text-gray-500 mt-2">
                            Welcome back! Please login to your account.
                        </p>
                    </div>

                    <div>
                        <label for="username" class="block text-sm font-medium text-gray-700 mb-2">
                            phone number
                        </label>

                        <input
                            v-model="phone_number"
                            id="username"
                            name="username"
                            placeholder="0912345678"
                            class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition">
                    </div>

                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                            Password
                        </label>
                        <input
                            v-model="password"
                            id="password"
                            type="password"
                            name="password"
                            placeholder="********"
                            class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition">
                    </div>

                    <button
                        type="submit"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition">
                        Login
                    </button>

                    <div class="mt-6 text-center text-sm text-gray-500">
                        還沒有帳號嗎?
                        <a href="/register"
                        class="text-blue-600 hover:underline font-medium">
                            註冊
                        </a>
                    </div>
                    
                </div>
            </form>
        </div>
    </body>

    
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        const app = Vue.createApp({
            data() {
                return {};
            },
            methods: {},
            created() {
                const urlParams = new URLSearchParams(window.location.search)
                if (urlParams.get("error") != null) {
                    Swal.fire({
                        title: 'Error!',
                        text: '帳號或密碼錯誤',
                        icon: 'error',
                        confirmButtonText: 'OK',
                    })
                }
            },
        });

        app.mount('#app');
    </script>
</html>
