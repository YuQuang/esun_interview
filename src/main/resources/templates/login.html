<!DOCTYPE html>
    <html lang="en">
    <head th:replace="~{fragments/header :: header('首頁')}"></head>
    <body class="bg-gray-100 min-h-screen flex items-center justify-center">
        <form th:action="@{/login}" method="post" class="space-y-5">
            <div id="app" class="w-full max-w-md bg-white rounded-xl shadow-lg p-8">
                <div class="flex flex-col gap-3">
                    <div class="text-center">
                        <h1 class="text-3xl font-bold text-gray-800">Sign In</h1>
                        <p class="text-gray-500 mt-2">
                            {{ message }}
                        </p>
                    </div>

                    <div>
                        <label for="username" class="block text-sm font-medium text-gray-700 mb-2">
                            username
                        </label>

                        <input
                            v-model="username"
                            id="username"
                            name="username"
                            placeholder="username"
                            class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition">
                    </div>

                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                            Password
                        </label>
                        <input
                            v-model="password"
                            id="password"
                            type="password"
                            name="password"
                            placeholder="********"
                            class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition">
                    </div>

                    <button
                        type="submit"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition">
                        Login
                    </button>

                    <div class="mt-6 text-center text-sm text-gray-500">
                        Don't have an account?
                        <a href="/register"
                        class="text-blue-600 hover:underline font-medium">
                            Register
                        </a>
                    </div>
                    
                </div>
            </form>
        </div>
    </body>

    
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        const app = Vue.createApp({
            data() {
                return {
                    username: '',
                    password: '',
                    message: 'Welcome back! Please login to your account.'
                };
            },
            methods: {
                async handleLogin() {
                    await axios.post(
                        "login",
                        {
                            username: this.username,
                            password: this.password
                        }
                    ).then((response) => {
                        if (response.data.success) {
                            this.message = "Login successful!";
                        } else {
                            this.message = "Invalid username or password.";
                        }
                    }).catch((error) => {
                        console.error(error);
                        this.message = "An error occurred. Please try again.";
                    });
                }
            },
            created() {
                const urlParams = new URLSearchParams(window.location.search)
                if (urlParams.get("error") != null) {
                    this.message = "Username or password is incorrect.";
                }
            },
        });

        app.mount('#app');
    </script>
</html>
