<!DOCTYPE html>
    <html lang="en">
    <head th:replace="~{fragments/header :: header('首頁')}"></head>
    <body class="bg-gray-100 min-h-screen flex items-center justify-center">
        <div id="app" class="w-full max-w-md bg-white rounded-xl shadow-lg p-8">
            <div class="flex flex-col gap-3">
                <div class="text-center">
                    <h1 class="text-3xl font-bold text-gray-800">Sign In</h1>
                    <p class="text-gray-500 mt-2">
                        {{ message }}
                    </p>
                </div>

                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                        Email
                    </label>

                    <input
                        v-model="email"
                        id="email"
                        type="email"
                        name="email"
                        placeholder="example@email.com"
                        class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition">
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                        Password
                    </label>
                    <input
                        v-model="password"
                        id="password"
                        type="password"
                        name="password"
                        placeholder="********"
                        class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition">
                </div>

                <button
                    type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition"
                    v-on:click="handleLogin">
                    Login
                </button>

                <div class="mt-6 text-center text-sm text-gray-500">
                    Don't have an account?
                    <a href="/register"
                    class="text-blue-600 hover:underline font-medium">
                        Register
                    </a>
                </div>
            </div>
        </div>
    </body>

    
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        const app = Vue.createApp({
            data() {
                return {
                    email: '',
                    password: '',
                    message: 'Welcome back! Please login to your account.'
                };
            },
            methods: {
                async handleLogin() {
                    await axios.post(
                        "auth/login",
                        {
                            email: this.email,
                            password: this.password
                        }
                    ).then((response) => {
                        if (response.data.success) {
                            this.message = "Login successful!";
                        } else {
                            this.message = "Invalid email or password.";
                        }
                    }).catch((error) => {
                        console.error(error);
                        this.message = "An error occurred. Please try again.";
                    });
                }
            }
        });

        app.mount('#app');
    </script>
</html>
