<!DOCTYPE html>
    <html lang="en">
    <head th:replace="~{fragments/header :: header('註冊')}"></head>
    <body class="bg-gray-100 min-h-screen flex items-center justify-center">
        <div id="app" class="w-full max-w-md bg-white rounded-xl shadow-lg p-8">
            <div class="flex flex-col gap-3">
                <div class="text-center">
                    <h1 class="text-3xl font-bold text-gray-800">註冊新使用者</h1>
                    <p class="mt-2 text-gray-500">
                        Welcome! New users can register here.
                    </p>
                </div>

                <div>
                    <label for="phone_number" class="block text-sm font-medium text-gray-700 mb-2">
                        Phone Number
                    </label>
                    <input
                        v-model="phone_number"
                        id="phone_number"
                        type="text"
                        name="phone_number"
                        placeholder="0912345678"
                        class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition">
                </div>


                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-2">
                        username
                    </label>

                    <input
                        v-model="username"
                        id="username"
                        name="username"
                        placeholder="username"
                        class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition">
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                        Password
                    </label>
                    <input
                        v-model="password"
                        id="password"
                        type="password"
                        name="password"
                        placeholder="********"
                        class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition">
                </div>

                <button
                    type="submit"
                    v-on:click.prevent="handleRegister"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold mt-3 py-3 rounded-lg transition">
                    Register
                </button>

                <div class="mt-5 text-center text-sm text-gray-500">
                    已經有帳號了嗎?
                    <a href="/login"
                    class="text-blue-600 hover:underline font-medium">
                        登入
                    </a>
                </div>
                
            </div>
        </div>
    </body>

    
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        const app = Vue.createApp({
            data() {
                return {
                    username: '',
                    password: '',
                    phone_number: '',
                };
            },
            methods: {
                async handleRegister() {
                    if(this.username.length < 5){
                        Swal.fire({
                            title: 'Error!',
                            text: '用戶名稱至少五個字元',
                            icon: 'error',
                            confirmButtonText: 'OK',
                        })
                        return
                    }else if(!/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/.test(password)){
                        Swal.fire({
                            title: 'Error!',
                            text: '密碼至少八個字元並且要包含大小寫及數字',
                            icon: 'error',
                            confirmButtonText: 'OK',
                        })
                        return
                    }else if(!/^09\d{8}$/.test(phone_number)){
                        Swal.fire({
                            title: 'Error!',
                            text: '電話號碼至少10位!',
                            icon: 'error',
                            confirmButtonText: 'OK',
                        })
                        return
                    }

                    await axios.post(
                        "/auth/register",
                        {
                            username: this.username,
                            password: this.password,
                            phone_number: this.phone_number
                        }
                    ).then((response) => {
                        Swal.fire({
                            title: 'Success!',
                            text: 'Registration successful!',
                            icon: 'success',
                            confirmButtonText: 'OK',
                        }).then((result) => {
                            window.location.href = "/login";
                        });
                    }).catch((error) => {
                        var message = ""
                        if (error.status === 400){
                            message = "Invalid input. Please check your data.";
                        }else{
                            message = "An error occurred. Please try again.";
                        }
                        Swal.fire({
                            title: 'Error!',
                            text: message,
                            icon: 'error',
                            confirmButtonText: 'OK'
                        })
                    });
                }
            },
        });

        app.mount('#app');
    </script>
</html>
